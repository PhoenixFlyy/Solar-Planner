name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Type-check
        run: pnpm --filter web typecheck

      - name: Unit tests
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync --directory apps/api

      - name: Lint
        run: uv run --directory apps/api ruff check .

      - name: Format check
        run: uv run --directory apps/api ruff format --check .

      - name: Type-check
        run: uv run --directory apps/api mypy .

      - name: Unit tests
        run: uv run --directory apps/api pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (walking skeleton smoke)
        run: pnpm --filter web test:e2e
