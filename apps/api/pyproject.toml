[project]
name = "solar-api"
version = "0.0.0"
description = "Solar Planner FastAPI backend (geo, solar, economics, reports)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    # 1.x is a proxy/sqlite rewrite; we want the 0.x httpx-client disk cache
    # (AsyncCacheClient + AsyncFileStorage + Controller). See CLAUDE.md.
    "hishel>=0.1.1,<1.0",
    "tenacity>=9.0",
    "pvlib>=0.11",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "mypy>=1.14",
    "ruff>=0.9",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solar_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["solar_api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Heavy geospatial/PV libs ship incomplete stubs — don't fail strict on them.
[[tool.mypy.overrides]]
module = ["pvlib.*", "pandas.*", "geopandas.*", "shapely.*", "pyproj.*", "hishel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
